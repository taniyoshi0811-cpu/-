<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文化祭 支出入力ページ</title>
  <style>
    :root {
      --bg: #f3f5fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Yu Gothic UI", "Meiryo", sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 680px; margin: 24px auto; padding: 0 16px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    h1 { margin: 0 0 14px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
    .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    input, button { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px; background: #fff; }
    button { border: none; color: #fff; background: var(--primary); cursor: pointer; font-weight: 700; }
    .msg { margin-top: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>文化祭 支出入力ページ</h1>
    <section class="panel">
      <form id="expenseForm">
        <div class="field">
          <label for="expenseDate">日付</label>
          <input id="expenseDate" type="date" required />
        </div>
        <div class="field">
          <label for="expenseAmount">金額（円）</label>
          <input id="expenseAmount" type="number" min="1" required placeholder="例: 1200" />
        </div>
        <div class="field">
          <label for="expenseReceipt">レシート画像</label>
          <input id="expenseReceipt" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label for="expenseMemo">メモ</label>
          <input id="expenseMemo" type="text" placeholder="例: コンビニ" />
        </div>
        <div class="field">
          <label for="expenseUser">入力者名</label>
          <input id="expenseUser" type="text" required placeholder="例: tanaka" />
        </div>
        <div>
          <button type="submit">送信</button>
        </div>
      </form>
      <div id="message" class="msg"></div>
    </section>
  </div>
  <script>
    const expenseForm = document.getElementById("expenseForm");
    const expenseDate = document.getElementById("expenseDate");
    const expenseAmount = document.getElementById("expenseAmount");
    const expenseReceipt = document.getElementById("expenseReceipt");
    const expenseMemo = document.getElementById("expenseMemo");
    const expenseUser = document.getElementById("expenseUser");
    const message = document.getElementById("message");

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
        reader.readAsDataURL(file);
      });
    }

    const nameFromQuery = new URLSearchParams(location.search).get("name");
    if (location.protocol === "file:") {
      message.textContent = "ブラウザで直接ファイルを開かず、http://localhost:3000/input.html で開いてください。";
    }
    if (nameFromQuery) expenseUser.value = nameFromQuery;
    expenseDate.value = todayISO();

    expenseForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const amount = Number(expenseAmount.value);
      if (!expenseDate.value || amount <= 0 || !expenseUser.value.trim()) return;

      try {
        let receiptImage = "";
        const receiptFile = expenseReceipt.files && expenseReceipt.files[0];
        if (receiptFile) {
          receiptImage = await fileToDataUrl(receiptFile);
        }

        const res = await fetch("/api/expenses", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: expenseDate.value,
            amount,
            memo: expenseMemo.value.trim(),
            user: expenseUser.value.trim(),
            receiptImage
          })
        });

        if (!res.ok) {
          message.textContent = "送信に失敗しました。サーバー接続や入力値を確認してください。";
          return;
        }

        expenseForm.reset();
        if (nameFromQuery) expenseUser.value = nameFromQuery;
        expenseDate.value = todayISO();
        message.textContent = "支出を送信しました。";
      } catch {
        message.textContent = "サーバーに接続できません。http://localhost:3000 で開いているか確認してください。";
      }
    });
  </script>
</body>
</html>
